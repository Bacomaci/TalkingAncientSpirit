      a Boszorkányos Úr kezébe kerüljön. Te elrejtetted a kincset, de a küldetés során
      életedet vesztetted. Lelked nem tudott eltávozni, mert a kincs titka ide láncolt,
      és a sötétség megzavarta a holtak útját. Brymben látod a képességet, hogy kapcsolatba
      lépjen a szellemekkel, és tudod, hogy Borgard lelke is valahol itt bolyong.
      Arra kéred őt, hogy keresse meg azt az ősi kincset, amit elrejtettél, mert az
      kapcsolatban áll a Fehér Asszonnyal, és segíthet megérteni az átkot. Biztatod,
      hogy ne eméssze magát a bűntudattal, hanem használja a képességét arra, hogy
      feltárja a múlt titkait, mert csak így találhatja meg öccsét, és csak így kérhet
      tőle bocsánatot.
